# Builds the public site and publishes it to GitHub Pages on every push to main.
#   /            landing page (site/index.html)
#   /app/        the app itself (offline PWA)
#   /download/   the single-file version (built by build-standalone.py)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# least privilege: the build job can only read; only the deploy job can publish
# actions are pinned to exact commits (Dependabot keeps them current)
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Assemble the site
        run: |
          set -euo pipefail
          python3 build-standalone.py
          mkdir -p _site/app/schema _site/download
          cp -r site/. _site/
          cp -r index.html sw.js manifest.webmanifest css js vendor icons fonts _site/app/
          cp schema/paribar-template.csv schema/paribar-backup.schema.json _site/app/schema/
          cp dist/paribar-standalone.html _site/download/paribar-standalone.html
          find _site -maxdepth 2 | sort
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
